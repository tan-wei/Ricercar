# ── Sane defaults for development ──────────────────────────────────────────

browser:
  # How patient the driver is, and where downloads land. How a browser is obtained is
  # deliberately not configurable: every source is driven through a browser you launched
  # by hand (see the "Cloudflare" section in README.md).
  navigation_timeout: 30000
  action_timeout: 15000
  # downloads_dir defaults to data/torrents
  #
  # close_on_exit (default true) closes that browser again when a command finishes. The
  # close is graceful, so the profile keeps its cookies and the next launch is signed in
  # again — set it to false to leave the window up instead (e.g. because you browse in
  # the same profile).

# A run: what it redoes, and where it keeps its notes.
run:
  resume: true
  # Skips the tasks already completed today, so an interrupted run picks up where it
  # stopped. `--no-resume` overrides it.
  # state_file defaults to data/state.json (known uploaders, completed tasks)
  #
  # task_history_file defaults to data/task_history.json: what each configured task has
  # yielded — how often it ran, how many result rows came back, when it last found
  # anything. It is written once per run and is *not* pruned to today, because its whole
  # point is noticing a task that has found nothing for months. `ricercar tasks` reads
  # it, and a run warns about the tasks stale_task_days (60) and stale_task_runs (5)
  # agree are dead; both have to be met, so a fresh configuration is never nagged.
  #
  # discovered_uploaders_file defaults to data/discovered_uploaders.json: uploaders
  # encountered for the first time during a run. `ricercar tasks --discovered` lists
  # them; `ricercar tasks --add-discovered` turns them into config tasks.

# When something fails, keep what the browser was looking at: the page, a screenshot,
# a trace, and the explanation. One directory per failure.
diagnostics:
  failures_dir: data/failures
  save_traces: true

# `ricercar` with no arguments runs on this interval; `--once` runs a single cycle.
schedule:
  interval_minutes: 60
  run_on_start: true

# One section per monitored tracker — listing a source here is what makes it run.
sources:
  rutracker:
    # Playwright cannot launch a browser for this tracker — Cloudflare blocks anything
    # it starts itself, so attach to a browser YOU launched by hand. Bootstrap once:
    #   just browser          (or the raw command, see README "Cloudflare")
    connect_url: "http://localhost:9222"
    login:
      # Put the real credentials in config.local.yml, which is gitignored. Set both and a
      # session that has expired is signed in again by itself; leave them empty and a lost
      # session always waits for you to type it in (a captcha or a Cloudflare interstitial
      # still can, whatever is configured).
      username: ""
      password: ""
    # The sections worth watching, name → the site's `f` id. A task that names no
    # category searches all of them — that is what "every category" means, and what
    # keeps a keyword search out of the sections nobody asked about.
    #
    # Only sections related to classical / academic music and classical painting / art
    # are listed.  IDs and names are verified against the current Rutracker forum layout.
    categories:
      # ── Classical music video ───────────────────────────────────────
      # Classical & modern academic music (Video)
      Classic_Modern_Video: 445
      # Classical & modern academic music (DVD Video)
      Classic_Modern_DVD_Video: 984
      # Opera, Operetta & Musical (Video)
      Opera_Video: 702
      # Opera, Operetta & Musical (DVD Video)
      Opera_DVD_Video: 983
      # Ballet & modern choreography (Video)
      Ballet_Video: 1990
      # Classics in modern arrangement, Classical Crossover (Video)
      Classic_Crossover_Video: 1793
      # Ballet & modern choreography (DVD Video)
      Ballet_DVD_Video: 2352
      # Classics in modern arrangement, Classical Crossover (DVD Video)
      Classic_Crossover_DVD_Video: 2384
      # Classical music, Opera, Ballet, Musical (Unofficial DVD Video)
      Classic_Unofficial_DVD_Video: 2263
      # Classical & modern academic music (HD Video)
      Classic_Modern_HD_Video: 1812
      # Opera, Operetta & Musical (HD Video)
      Opera_HD_Video: 655
      # Ballet & modern choreography (HD Video)
      Ballet_HD_Video: 1777

      # ── Classical music audio lossless ──────────────────────────────
      # Complete works collections & multi-disc releases (lossless)
      Multiple_Disc_Lossless: 560
      # Opera (lossless)
      Opera_Lossless: 794
      # Vocal music (lossless)
      Vocal_Music_Lossless: 556
      # Choral music (lossless)
      Choral_Music_Lossless: 2307
      # Orchestral music (lossless)
      Orchestral_Lossless: 557
      # Concerto for instrument & orchestra (lossless)
      Concerto_Lossless: 2308
      # Chamber instrumental music (lossless)
      Chamber_Lossless: 558
      # Solo instrumental music (lossless)
      Solo_Lossless: 793
      # Sacred chants & music (lossy & lossless)
      Chants: 1395

      # ── Classical music audio lossy ─────────────────────────────────
      # Complete works collections & multi-disc releases (lossy)
      Multiple_Disc_Lossy: 436
      # Vocal & choral music (lossy)
      Vocal_And_Choral_Music_Lossy: 2309
      # Orchestral music (lossy)
      Orchestral_Lossy: 2310
      # Chamber & solo instrumental music (lossy)
      Chamber_And_Solo_Lossy: 2311

      # ── Modern classical / crossover ────────────────────────────────
      # Classics in modern arrangement, Classical Crossover (lossy & lossless)
      Classic_Modern_Crossover_Lossless_Lossy: 969
      # Modern Classical, Electroacoustic (lossless)
      Modern_Classical_Lossless: 1871
      # Modern Classical, Electroacoustic (lossy)
      Modern_Classical_Lossy: 1867

      # ── Hi-Res classical music ──────────────────────────────────────
      # Classical instrumental music, Classical Crossover (Hi-Res)
      Classical_Instrumental_HiRes: 1884
      # Classical vocal & choral music, Classical Crossover (Hi-Res)
      Classical_Vocal_Choral_HiRes: 1164

      # ── Digitised classical (rips from analog media) ────────────────
      # Classics & classics in modern arrangement (rips)
      Classic_And_Modern_Digitised: 1660

      # ── Sheet music & music literature ──────────────────────────────
      # Academic music (Sheet music & Media CD)
      Academic_Music_Scores: 944
      # Music literature & theory
      Music_Literature_Theory: 2074

      # ── Classical painting & art ────────────────────────────────────
      # [Doc] Art, art history
      Art_History_Documentary: 2538
      # Art studies, Cultural studies (Humanities)
      Art_Studies_Culturology: 1684
      # Drawing, graphic design (Books & magazines)
      # Drawing_Graphic_Design: 765
    # Optional override of the built-in selectors/URLs/literals, so a site redesign can
    # be patched without touching code. Any subset of the keys in
    # src/ricercar/sources/rutracker/selectors.py is accepted, e.g.:
    #   selectors_file: config/selectors-rutracker.yml
    selectors_file: null
    # One entry per search. Any of `text` (keywords), `author` (uploader) and
    # `category` (a section id, or "*" for every configured section); a task that names
    # no category searches all of them:
    #   - text: Bach
    #   - author: "Some Uploader"
    #   - author: "Someone Else"
    #     category: 794
    #   - category: "*"            # anything new, anywhere configured
    tasks: []
    must_complete_tasks: []
    random_choice: 3
    # How far to follow a search's pager, at most. A ceiling, not a promise: the pager
    # states the real number ("Страница 1 из 10") and that is what the progress bar
    # counts to, so this only matters for a search longer than it.
    max_pages: 50
    quota:
      limit_torrents_one_day: 50
      # Wait this long before the next page, after a page that asked the tracker for a
      # torrent — the tracker sees every request, and page-after-page at machine speed is
      # what "too fast to be a person" looks like. A download that turns out to be
      # duplicate content still counts. A page of rows the database already had makes no
      # request beyond the one that fetched it, so it never waits. 0 (default): never wait.

retry:
  max_attempts: 3
  base_delay: 2.0
  max_delay: 60.0
  backoff_factor: 2.0

log:
  level: DEBUG
  colorize: true
  file_rotation: 1 day
  file_retention: 30 days
  json_output: false

database: {}
# path defaults to data/torrents.db

# ── Optional: notifications via apprise ────────────────────────────────────
