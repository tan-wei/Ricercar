repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: commitlint
        name: commitlint
        entry: node node_modules/@commitlint/cli/cli.js --edit
        language: system
        stages: [commit-msg]
        always_run: true
