name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Conventional Commits, sentence-case subjects (commitlint.config.cjs) — the same check
  # the local `commit-msg` hook runs, so a bad message cannot reach `main`.
  commits:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: extractions/setup-just@v2
      - run: npm ci
      - name: Check the pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          FROM_SHA: ${{ github.event.before }}
          TO_SHA: ${{ github.sha }}
        run: just commitlint-range "$FROM_SHA" "$TO_SHA"
      # A branch's first push reports the zero sha as the "before" end: there is no range
      # then, so only the tip commit is checked.
      - name: Check the tip commit (first push to a branch)
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: just commitlint
      - name: Check the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          FROM_SHA: ${{ github.event.pull_request.base.sha }}
          TO_SHA: ${{ github.event.pull_request.head.sha }}
        run: just commitlint-range "$FROM_SHA" "$TO_SHA"

  quality:
    name: lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - run: just sync
      - run: just lint
      - run: just format-check
      - run: just typecheck

  # No browser is installed and no network is used here: the suite works on the pages and
  # the .torrent in tests/fixtures, and the three tests that drive a real browser skip
  # themselves when none is attached (see the `integration` marker). Both platforms,
  # because this project is developed on Windows and run wherever the user is.
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - uses: extractions/setup-just@v2
      - run: just sync
      - run: just test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: extractions/setup-just@v2
      - run: just sync
      - run: just coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
