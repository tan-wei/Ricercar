name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Conventional Commits, sentence-case subjects (commitlint.config.cjs) — the same check
  # the local `commit-msg` hook runs, so a bad message cannot reach `main`.
  commits:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: extractions/setup-just@v4
      - run: npm ci
      - name: Check the pushed commits
        if: github.event_name == 'push'
        env:
          FROM_SHA: ${{ github.event.before }}
          TO_SHA: ${{ github.sha }}
        # A branch's first push reports the zero sha as the "before" end, and a force-push
        # reports a commit that nothing points at any more (so the checkout never fetched
        # it). Neither gives a range to walk, and in both cases the tip is what is new.
        run: |
          if git merge-base --is-ancestor "$FROM_SHA" "$TO_SHA" 2>/dev/null; then
            just commitlint-range "$FROM_SHA" "$TO_SHA"
          else
            echo "$FROM_SHA is not an ancestor of $TO_SHA — checking the tip commit only"
            just commitlint
          fi
      - name: Check the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          FROM_SHA: ${{ github.event.pull_request.base.sha }}
          TO_SHA: ${{ github.event.pull_request.head.sha }}
        run: just commitlint-range "$FROM_SHA" "$TO_SHA"

  quality:
    name: lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: just sync
      - run: just lint
      - run: just format-check
      - run: just typecheck

  # No browser is installed and no network is used here: the suite works on the pages and
  # the .torrent in tests/fixtures, and the three tests that drive a real browser skip
  # themselves when none is attached (see the `integration` marker). Both platforms,
  # because this project is developed on Windows and run wherever the user is.
  #
  # Every cell measures coverage and uploads it, the way TagMuse does: a flag naming the
  # cell, so Codecov can merge the six reports and keep them tellable apart, and the XML
  # as a build artifact. `fail_ci_if_error: false`, because a Codecov hiccup is not a
  # reason to call a green suite red.
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: just sync
      - run: just coverage
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          disable_search: true
          flags: ${{ matrix.os }}-${{ matrix.python-version }}
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
